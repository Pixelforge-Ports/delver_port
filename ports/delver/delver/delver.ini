[config]
deadzone_mode = scaled_radial
deadzone = 2000
deadzone_scale = 6
deadzone_triggers = 3000
mouse_delay = 16

[controls]
overlay = clear
up = w
down = s
left = a
right = d
left_analog_up = w
left_analog_down = s
left_analog_left = a
left_analog_right = d
right_analog = mouse_movement
a = e
b = mouse_left
x = i
y = m
l1 = left
r1 = right
l2 = hold_state look
r2 = mouse_left
start = esc
back = hold_state hotkey

[controls:look]
overlay = parent
dpad = mouse_movement
left_analog = mouse_movement

[controls:hotkey]
overlay = clear
a = enter
b = esc
x = q
l1 = [
r1 = ]
